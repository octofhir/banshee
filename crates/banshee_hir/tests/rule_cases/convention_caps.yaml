# CV** convention, CP** capitalisation, and JB** JSONB rules.

- name: ne_bang_equals_flagged_and_fixed
  rule: CV01
  fail: "SELECT id FROM users WHERE a != 1"
  fix: "SELECT id FROM users WHERE a <> 1"

- name: ne_angle_ok
  rule: CV01
  pass: "SELECT id FROM users WHERE a <> 1"

- name: null_equality_flagged_and_fixed
  rule: CV05
  fail: "SELECT id FROM users WHERE a = NULL"
  fix: "SELECT id FROM users WHERE a IS NULL"

- name: is_null_ok
  rule: CV05
  pass: "SELECT id FROM users WHERE a IS NULL"

- name: missing_semicolon_flagged_and_fixed
  rule: CV06
  fail: "SELECT id FROM users"
  fix: "SELECT id FROM users;"

- name: terminated_statement_ok
  rule: CV06
  pass: "SELECT id FROM users;"

- name: lowercase_keyword_flagged_and_fixed
  rule: CP01
  fail: "select id from users;"
  fix: "SELECT id FROM users;"

- name: upper_keyword_ok
  rule: CP01
  pass: "SELECT id FROM users;"

# Unreserved keyword used as a column name must not be nagged as a keyword.
- name: unreserved_kw_as_column_name_ok
  rule: CP01
  pass: "CREATE TABLE t (type TEXT NOT NULL, value INT);"

- name: qualified_kw_column_ok
  rule: CP01
  pass: "COMMENT ON COLUMN bank_transaction.type IS 'x';"

# Contextual keywords banshee lexes as identifiers must not be flagged as
# mis-cased identifiers (CP02).
- name: trigger_contextual_keywords_ok
  rule: CP02
  pass: "CREATE TRIGGER x BEFORE UPDATE ON t FOR EACH ROW EXECUTE PROCEDURE f();"

- name: enum_value_keywords_ok
  rule: CP02
  pass: "ALTER TYPE my_enum ADD VALUE 'BILLING_IN_TIPS';"

# A genuine CamelCase identifier is still flagged by CP02.
- name: camelcase_identifier_flagged
  rule: CP02
  fail: "SELECT fooBar FROM t;"

- name: jsonb_text_comparison_flagged_and_fixed
  rule: JB01
  fail: "SELECT id FROM t WHERE data -> 'k' = 'v'"
  fix: "SELECT id FROM t WHERE data ->> 'k' = 'v'"

- name: jsonb_text_arrow_ok
  rule: JB01
  pass: "SELECT id FROM t WHERE data ->> 'k' = 'v'"
