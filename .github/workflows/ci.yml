name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Parser-only library
        run: |
          cargo check --locked -p banshee --lib --no-default-features
          python3 - <<'PY'
          import re
          import subprocess
          graph = subprocess.check_output([
              "cargo", "tree", "--locked", "-p", "banshee",
              "--no-default-features", "--edges", "normal,build",
              "--prefix", "none", "--format", "{p}",
          ], text=True)
          forbidden = re.findall(
              r"^(?:banshee_(?:hir|completion|format|config|templater|schema|lsp)|clap|annotate-snippets|rayon|globset|tokio|sqlx) v.*",
              graph, re.M,
          )
          if forbidden:
              raise SystemExit("Unexpected parser dependencies: " + ", ".join(forbidden))
          PY
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  test-db-feature:
    name: test (db feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test with db feature
        run: cargo test -p banshee --features db

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
