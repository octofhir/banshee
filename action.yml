name: banshee PostgreSQL SQL
description: Lint or format-check PostgreSQL SQL with banshee.
branding:
  icon: database
  color: purple

inputs:
  command:
    description: "banshee subcommand to run: lint or format."
    default: lint
  args:
    description: "Files/directories to check (default: current directory)."
    default: "."
  format:
    description: "Lint diagnostic format: human | json | github | sarif."
    default: github
  sarif-file:
    description: "For lint, write SARIF to this file. Upload it with github/codeql-action/upload-sarif."
    default: ""
  version:
    description: "Release tag to install (default: latest stable)."
    default: latest
  working-directory:
    description: "Directory to run in."
    default: "."

runs:
  using: composite
  steps:
    - name: Install banshee
      shell: bash
      run: |
        set -euo pipefail
        ver="${{ inputs.version }}"
        base="https://github.com/octofhir/banshee/releases"
        url="$base/latest/download"
        [ "$ver" != "latest" ] && url="$base/download/$ver"
        case "$(uname -m)" in
          x86_64|amd64) target="x86_64-unknown-linux-musl" ;;
          aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
          *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
        esac
        archive="banshee-${target}.tar.gz"
        curl -fsSL "$url/$archive" -o "$archive"
        curl -fsSL "$url/$archive.sha256" -o "$archive.sha256"
        echo "$(awk '{print $1}' "$archive.sha256")  $archive" | sha256sum -c -
        tar -xzf "$archive"
        install -m 0755 banshee "$HOME/.local/bin/banshee" 2>/dev/null || sudo install -m 0755 banshee /usr/local/bin/banshee
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Run banshee
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BANSHEE_COMMAND: ${{ inputs.command }}
        BANSHEE_REPORT_FORMAT: ${{ inputs.format }}
        BANSHEE_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail
        case "$BANSHEE_COMMAND" in
          format)
            banshee format --check ${{ inputs.args }}
            ;;
          lint)
            if [ -n "$BANSHEE_SARIF_FILE" ]; then
              banshee lint --format sarif ${{ inputs.args }} > "$BANSHEE_SARIF_FILE"
            else
              banshee lint --format "$BANSHEE_REPORT_FORMAT" ${{ inputs.args }}
            fi
            ;;
          *)
            echo "command must be lint or format" >&2
            exit 2
            ;;
        esac
